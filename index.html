<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FINAL - Tachado + Like</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;padding:16px;max-width:1200px;margin:auto}
.status-bar{background:#151515;border:1px solid #262626;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0;position:sticky;top:10px;z-index:99}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.dot.green{background:#22c55e;animation:pulse 1.5s infinite}.dot.red{background:#ef4444}.dot.yellow{background:#eab308;animation:pulse 1.5s infinite}.dot.gray{background:#555}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.progress{height:10px;background:#222;border-radius:10px;overflow:hidden;flex:1;min-width:120px}.progress-bar{height:100%;background:#1877F2;width:0%;transition:.3s}
.card{background:#171717;border:1px solid #262626;border-radius:12px;padding:12px;margin:6px 0;display:flex;gap:12px;align-items:center;transition:.3s}
.card.on{border-color:#1877F2;background:#111e36}
.card.respondido{background:#0f1f14;border-color:#14532d;opacity:.6}
.card.respondido .msg-text{text-decoration:line-through;color:#888}
.card.respondido .from-name{text-decoration:line-through}
.avatar{width:44px;height:44px;border-radius:50%;background:#222;object-fit:cover}
.btn{background:#1877F2;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer}.btn-green{background:#16a34a}.btn-orange{background:#ea580c}.btn-gray{background:#333}.btn-red{background:#dc2626}
.input{width:100%;background:#111;border:1px solid #333;border-radius:10px;padding:10px;color:#fff;margin:4px 0}
.log{background:#111;border:1px solid #222;border-radius:10px;padding:12px;height:350px;overflow:auto;font-size:12px;color:#9ca3af}
.toggle{margin-left:auto;width:44px;height:24px;background:#333;border-radius:20px;position:relative;cursor:pointer}.toggle.on{background:#1877F2}.toggle:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.toggle.on:after{left:22px}
.badge{background:#222;border-radius:20px;padding:4px 10px;font-size:12px;min-width:80px;text-align:center}.badge.red{background:#3f1a1a;color:#f87171}.badge.green{background:#132e1f;color:#4ade80}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.stat{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:24px;display:block}
.indicator{display:flex;align-items:center;gap:6px;font-size:12px;background:#1e1e1e;border:1px solid #2a2a2a;padding:6px 10px;border-radius:20px}
.check{width:22px;height:22px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.like{font-size:12px;color:#f472b6}
</style></head><body>
<h2>Portafolio - FINAL con Tachado + Like</h2>
<div id="perfilTop" style="margin:8px 0;color:#4ade80"></div>
<div id="loginBox" style="background:#111;border:1px dashed #444;padding:16px;border-radius:12px">
<input id="token" class="input" placeholder="Pega token EAA..."><button class="btn" onclick="cargarTodo()" style="width:100%">🔌 Cargar 8 páginas</button><p id="status" style="color:#fbbf24"></p></div>
<div id="app" style="display:none">
<div class="status-bar">
<div class="indicator"><span id="dotConn" class="dot gray"></span><span id="txtConn">Desconectado</span></div>
<div class="indicator"><span id="dotWork" class="dot gray"></span><span id="txtWork">Pausado</span></div>
<div class="indicator">⚡ <span id="txtSpeed">0/s</span></div>
<div class="indicator">⏱️ <span id="txtTimer">--</span></div>
<div class="progress"><div id="progScan" class="progress-bar"></div></div>
</div>
<div class="grid">
<div class="stat"><b id="statPag">0</b>Páginas</div>
<div class="stat"><b id="statPend">0</b>Pendientes</div>
<div class="stat"><b id="statResp">0</b>Respondidos</div>
<div class="stat"><b id="statScan">0</b>Posts</div>
</div>
<div id="lista"></div>
<div style="background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin:12px 0">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<label style="font-size:12px">Últimos: <select id="dias" class="input" style="width:90px"><option value="0">Todos</option><option value="7" selected>7 días</option></select></label>
<label style="font-size:12px">x: <select id="conc" class="input" style="width:70px"><option value="5" selected>x5</option><option value="10">x10</option></select></label>
<label style="font-size:12px">Posts: <select id="limitPosts" class="input" style="width:70px"><option value="100">100</option><option value="200" selected>200</option></select></label>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<input id="kw1" class="input" value="precio"><input id="msg1" class="input" value="Gracias {name} te enviamos info">
<input id="kw2" class="input" value="donde,pais"><input id="msg2" class="input" value="Hola {name} saludos desde Guatemala">
<input id="msgA" class="input" value="Gracias por tu comentario {name}"><input id="msgB" class="input" value="que te pareció el video {name}?">
</div>
<label style="font-size:12px"><input type="checkbox" id="likeCheck" checked> Dar Like automático al comentario (recomendado)</label>
</div>
<div style="background:#052e16;border:1px solid #166534;border-radius:12px;padding:14px">
<div style="display:flex;gap:8px"><button class="btn btn-orange" onclick="scanAllPages()">⚡ Scan Rápido</button><button class="btn btn-gray" onclick="limpiarHist()">Limpiar historial</button></div>
<div style="margin-top:12px">
<button id="btnAuto" class="btn btn-green" style="width:100%;font-size:16px" onclick="toggleAuto()">▶️ Activar - Responder todo con tachado y like</button>
<div class="progress" style="height:14px;margin-top:8px"><div id="progResp" class="progress-bar" style="background:#22c55e"></div></div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-top:4px"><span id="txtProgResp">0 / 0</span><span id="txtNext">--</span></div>
</div>
</div>
<h3>📋 Lista - Se tacha al responder + Like</h3>
<div id="pendLista" style="max-height:400px;overflow:auto;background:#0f0f0f;border:1px solid #222;border-radius:10px;padding:8px"></div>
<h3>📡 Log</h3><div class="log" id="log"></div>
</div>
<script>
let token='',paginas=[],conectadas={},pageTokens={},pendientes=[],respondidos=new Set(JSON.parse(localStorage.getItem('respondidos_v3')||'[]')),totalRespHoy=parseInt(localStorage.getItem('respHoy')||'0'),auto=false,timer=null,countdownTimer=null,ultimoMsg='',conteoPorPagina={},scanTotal=0,scanDone=0,scanStart=0;
function el(id){return document.getElementById(id);}
function setConn(ok){let d=el('dotConn'),t=el('txtConn');if(d)d.className='dot '+(ok?'green':'red');if(t)t.innerText=ok?'Conectado':'Desconectado';}
function setWork(w,txt){let d=el('dotWork'),t=el('txtWork');if(d)d.className='dot '+(w?'yellow':'gray');if(t)t.innerText=txt||(w?'Trabajando':'Pausado');}
function log(h){let e=el('log');if(e)e.innerHTML=`<div style="margin:3px 0;border-left:3px solid #1877F2;padding-left:8px">${new Date().toLocaleTimeString()} - ${h}</div>`+e.innerHTML;}
function limpiarHist(){if(confirm('Borrar historial?')){localStorage.removeItem('respondidos_v3');respondidos=new Set();conteoPorPagina={};log('Historial limpiado');}}
function getSmartMsg(c,n){
 let lc=(c||'').toLowerCase();
 let rules=[{kw:el('kw1').value.split(','),msg:el('msg1').value},{kw:el('kw2').value.split(','),msg:el('msg2').value},];
 for(let r of rules){if(r.kw.some(k=>k.trim()&&lc.includes(k.trim().toLowerCase()))){return r.msg.replace('{name}',n||'');}}
 let msgs=[el('msgA').value,el('msgB').value].filter(Boolean);
 let disp=msgs.filter(m=>m!==ultimoMsg);
 let msg=disp[Math.floor(Math.random()*disp.length)]||msgs[0];
 ultimoMsg=msg;return msg.replace('{name}',n||'');
}
async function cargarTodo(){
 token=el('token').value.trim();if(!token.startsWith('EAA')){alert('Token EAA');return;}
 localStorage.setItem('fb_token',token);if(el('status'))el('status').innerText='Conectando...';setConn(false);
 let allMap={};
 try{
  let meR=await fetch(`https://graph.facebook.com/v21.0/me?fields=name,picture.type(large)&access_token=${token}`);
  let me=await meR.json();if(me.error)throw new Error(me.error.message);
  el('perfilTop').innerHTML=`✅ Conectado como <b>${me.name}</b>`;
  let r1=await fetch(`https://graph.facebook.com/v21.0/me/accounts?fields=name,id,picture.type(large),access_token&limit=100&access_token=${token}`);
  let j1=await r1.json();if(j1.data)j1.data.forEach(p=>{allMap[p.id]=p;});
  let rb=await fetch(`https://graph.facebook.com/v21.0/me/businesses?fields=id&limit=20&access_token=${token}`);
  let jb=await rb.json();
  if(jb.data){for(let b of jb.data){try{let ro=await fetch(`https://graph.facebook.com/v21.0/${b.id}/owned_pages?fields=name,id,picture.type(large)&limit=100&access_token=${token}`);let jo=await ro.json();if(jo.data)jo.data.forEach(p=>{if(!allMap[p.id])allMap[p.id]=p;});let rc=await fetch(`https://graph.facebook.com/v21.0/${b.id}/client_pages?fields=name,id,picture.type(large)&limit=100&access_token=${token}`);let jc=await rc.json();if(jc.data)jc.data.forEach(p=>{if(!allMap[p.id])allMap[p.id]=p;});}catch(e){}}}
  for(let p of Object.values(allMap)){if(!p.access_token){try{let rt=await fetch(`https://graph.facebook.com/v21.0/${p.id}?fields=access_token&access_token=${token}`);let jt=await rt.json();if(jt.access_token)p.access_token=jt.access_token;}catch(e){}}if(p.access_token)pageTokens[p.id]=p;}
  paginas=Object.values(allMap);el('loginBox').style.display='none';el('app').style.display='block';el('statPag').innerText=paginas.length;el('statResp').innerText=totalRespHoy;paginas.forEach(p=>{conectadas[p.id]=true;});render();setConn(true);setWork(false,'Listo');log(`${paginas.length} páginas`);}catch(e){el('status').innerText='Error: '+e.message;setConn(false);}
}
function render(){let e=el('lista');if(!e)return;e.innerHTML=paginas.map(p=>`<div class="card ${conectadas[p.id]?'on':''}"><img src="${p.picture?.data?.url||''}" class="avatar"><div style="flex:1"><b>${p.name}</b><br><small>${p.id}</small></div><span class="badge ${ (conteoPorPagina[p.id]||0)>0 ? 'red':'green'}" id="badge-${p.id}">${conteoPorPagina[p.id]||0}</span><div class="toggle ${conectadas[p.id]?'on':''}" onclick="conectadas['${p.id}']=!conectadas['${p.id}'];render()"></div></div>`).join('');}
async function fetchAllPostsDeep(pageId,pToken,limit){let all=[];let url=`https://graph.facebook.com/v21.0/${pageId}/feed?fields=id,created_time&limit=50&access_token=${pToken}`;let count=0;let dias=parseInt(el('dias').value)||0;let cutoff=dias>0?Date.now()-dias*24*3600*1000:0;while(url&&count<limit){let r=await fetch(url);let j=await r.json();if(j.error)break;if(!j.data)break;let filtered=j.data;if(cutoff>0){filtered=j.data.filter(p=> new Date(p.created_time).getTime()>cutoff); if(filtered.length<j.data.length){all=all.concat(filtered);break;}}all=all.concat(filtered);count+=filtered.length;url=j.paging?.next;}return all.slice(0,limit);}
async function scanOnePost(post,p,seenGlobal){try{let comments=[];let urlC=`https://graph.facebook.com/v21.0/${post.id}/comments?fields=id,from{name,id},message,created_time,comments{from},is_hidden&filter=stream&limit=100&access_token=${p.access_token}`;while(urlC){let rc=await fetch(urlC);let jc=await rc.json();if(!jc.data)break;for(let c of jc.data){if(seenGlobal.has(c.id))continue;seenGlobal.add(c.id);if(respondidos.has(c.id))continue;if(c.from&&c.from.id===p.id)continue;if(c.is_hidden)continue;if(c.comments&&c.comments.data&&c.comments.data.some(r=>r.from.id===p.id)){respondidos.add(c.id);continue;}comments.push({pageId:p.id,pageName:p.name,postId:post.id,commentId:c.id,message:c.message,fromName:c.from?.name||'amigo',time:c.created_time,pToken:p.access_token});}urlC=jc.paging?.next;}return comments;}catch(e){return [];} }
async function scanAllPages(){
 let activas=Object.keys(conectadas).filter(id=>conectadas[id]);if(activas.length===0){alert('Activa 1');return;}
 let limit=parseInt(el('limitPosts').value)||200;let conc=parseInt(el('conc').value)||5;pendientes=[];conteoPorPagina={};let totalPosts=0;scanTotal=activas.length*limit;scanDone=0;scanStart=Date.now();setWork(true,`Escaneando x${conc}...`);el('progScan').style.width='0%';el('pendLista').innerHTML='<div style="padding:20px;text-align:center">⚡ Escaneando...</div>';
 for(let pageId of activas){
  try{
   let p=pageTokens[pageId];if(!p)continue;log(`${p.name} - ${limit} posts`);
   let posts=await fetchAllPostsDeep(pageId,p.access_token,limit);totalPosts+=posts.length;let countPage=0;let seenIds=new Set();let idx=0;
   while(idx<posts.length){let batch=posts.slice(idx,idx+conc);let results=await Promise.all(batch.map(post=>scanOnePost(post,p,seenIds)));for(let arr of results){for(let c of arr){pendientes.push(c);countPage++;}scanDone++;let prog=el('progScan');if(prog&&scanTotal>0)prog.style.width=Math.min(100,(scanDone/scanTotal*100))+'%';let elapsed=(Date.now()-scanStart)/1000;let speed=elapsed>0?(scanDone/elapsed).toFixed(1):0;let ts=el('txtSpeed');if(ts)ts.innerText=speed+' posts/seg';el('statScan').innerText=scanDone;}idx+=conc;}
   conteoPorPagina[pageId]=countPage;let badge=el(`badge-${pageId}`);if(badge){badge.innerText=countPage;badge.className='badge '+(countPage>0?'red':'green');}
  }catch(e){log(`Error ${pageId}`);}
 }
 let sumaReal=Object.values(conteoPorPagina).reduce((a,b)=>a+b,0);el('statPend').innerText=sumaReal;
 // Render con IDs para tachado
 el('pendLista').innerHTML=pendientes.map(p=>`
  <div class="card" id="card-${p.commentId}" style="border-left:4px solid #f59e0b">
   <div style="flex:1">
    <b class="from-name">${p.pageName} - ${p.fromName}</b>: <span class="msg-text">"${(p.message||'').substring(0,110)}"</span><br>
    <small style="color:#666">${new Date(p.time).toLocaleString()}</small> <span class="like" id="like-${p.commentId}"></span>
   </div>
   <div id="check-${p.commentId}" style="display:none" class="check">✓</div>
  </div>
 `).join('') || '<div style="padding:20px;text-align:center;color:#4ade80">✅ No hay pendientes</div>';
 el('progScan').style.width='100%';setWork(false,`Listo: ${sumaReal} pendientes`);log(`✅ ${sumaReal} pendientes en ${totalPosts} posts`);el('progResp').style.width='0%';el('txtProgResp').innerText=`0 / ${sumaReal}`;
}

function toggleAuto(){
 if(pendientes.length===0){alert('Scan primero');return;}
 let btn=el('btnAuto');
 if(auto){auto=false;clearTimeout(timer);clearInterval(countdownTimer);if(btn){btn.innerText='▶️ Activar - Responder con tachado y like';btn.className='btn btn-green';}setWork(false,'Pausado');log('Pausado');return;}
 auto=true;if(btn){btn.innerText='⏸️ Pausar - Tachando y dando like...';btn.className='btn btn-red';}setWork(true,'Respondiendo con like...');responderNext();
}

async function responderNext(){
 if(!auto||pendientes.length===0){auto=false;let btn=el('btnAuto');if(btn){btn.innerText='▶️ Activar - Responder con tachado y like';btn.className='btn btn-green';}setWork(false,pendientes.length===0?'✅ Todos tachados':'Pausado');return;}
 let it=pendientes.shift();
 let totalInicial=Object.values(conteoPorPagina).reduce((a,b)=>a+b,0)+pendientes.length+1;
 let remaining=pendientes.length;
 let pr=el('progResp');if(pr&&totalInicial>0)pr.style.width=((totalInicial-remaining)/totalInicial*100)+'%';
 let tpr=el('txtProgResp');if(tpr)tpr.innerText=`${totalInicial-remaining} / ${totalInicial}`;
 if(conteoPorPagina[it.pageId]&&conteoPorPagina[it.pageId]>0)conteoPorPagina[it.pageId]--;
 let sumaReal=Math.max(0,Object.values(conteoPorPagina).reduce((a,b)=>a+b,0)+remaining);
 el('statPend').innerText=sumaReal;
 let badge=el(`badge-${it.pageId}`);if(badge){badge.innerText=(conteoPorPagina[it.pageId]||0);badge.className='badge '+((conteoPorPagina[it.pageId]||0)>0?'red':'green');}

 // TACHAR Y LIKE VISUAL
 let card=el(`card-${it.commentId}`);
 let check=el(`check-${it.commentId}`);
 let likeSpan=el(`like-${it.commentId}`);

 try{
  let msg=getSmartMsg(it.message,it.fromName);
  
  // 1. Dar Like primero
  let likeOk=false;
  let likeCheck=el('likeCheck');
  if(likeCheck&&likeCheck.checked){
   try{
    let lr=await fetch(`https://graph.facebook.com/v21.0/${it.commentId}/likes?method=POST&access_token=${it.pToken}`,{method:'POST'});
    let lj=await lr.json();
    if(lj.success||!lj.error){likeOk=true; if(likeSpan)likeSpan.innerText='❤️ Like dado'; log(`❤️ Like a ${it.fromName}`);}
   }catch(e){}
  }

  // 2. Responder
  log(`💬 ${it.pageName} → ${it.fromName}: "${(it.message||'').substring(0,30)}" → "${msg}"`);
  let rp=await fetch(`https://graph.facebook.com/v21.0/${it.commentId}/comments?method=POST&message=${encodeURIComponent(msg)}&access_token=${it.pToken}`,{method:'POST'});
  let jr=await rp.json();
  if(jr.id){
   respondidos.add(it.commentId);
   localStorage.setItem('respondidos_v3',JSON.stringify([...respondidos]));
   totalRespHoy++;localStorage.setItem('respHoy',totalRespHoy);el('statResp').innerText=totalRespHoy;
   // TACHAR VISUALMENTE
   if(card){card.classList.add('respondido');}
   if(check){check.style.display='flex';}
   if(likeSpan && !likeOk){likeSpan.innerText='';}
   if(likeSpan && likeOk){likeSpan.innerText='❤️ Like + ✅ Respondido';}
   log(`✅ Tachado: ${it.fromName} - Like ${likeOk?'OK':''}`);
  }else{
   log(`❌ ${jr.error?.message}`);
   if(jr.error?.code!==368)pendientes.push(it);
   else{
    // Revertir tachado si falla
    if(card)card.classList.remove('respondido');
    if(check)check.style.display='none';
   }
  }
 }catch(e){log(e.message);}

 let min=75,max=150;
 let delay=(Math.floor(Math.random()*(max-min+1))+min)*1000;
 let sec=Math.round(delay/1000),left=sec;
 let tn=el('txtNext'),tt=el('txtTimer');
 if(tn)tn.innerText=`Próximo en ${left}s - Quedan ${pendientes.length}`;
 if(tt)tt.innerText=`Próximo en ${left}s`;
 clearInterval(countdownTimer);
 countdownTimer=setInterval(()=>{left--;if(left>=0){if(tn)tn.innerText=`Próximo en ${left}s - Quedan ${pendientes.length}`;if(tt)tt.innerText=`Próximo en ${left}s`;}else clearInterval(countdownTimer);},1000);
 timer=setTimeout(responderNext,delay);
}

let saved=localStorage.getItem('fb_token');if(saved){let e=el('token');if(e)e.value=saved;}
</script></body></html>
