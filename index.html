
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portafolio - Fix Error</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;padding:16px;max-width:1200px;margin:auto}
.status-bar{background:#151515;border:1px solid #262626;border-radius:14px;padding:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0;position:sticky;top:10px;z-index:10}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
.dot.green{background:#22c55e;box-shadow:0 0 8px #22c55e}.dot.red{background:#ef4444}.dot.yellow{background:#eab308}.dot.gray{background:#555}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.progress{height:10px;background:#222;border-radius:10px;overflow:hidden;flex:1;min-width:150px}
.progress-bar{height:100%;background:linear-gradient(90deg,#1877F2,#22c55e);width:0%;transition:.3s}
.card{background:#171717;border:1px solid #262626;border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:12px;align-items:center}
.card.on{border-color:#1877F2;background:#121e35}
.avatar{width:48px;height:48px;border-radius:50%;background:#222;object-fit:cover}
.btn{background:#1877F2;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-green{background:#16a34a}.btn-orange{background:#ea580c}.btn-gray{background:#333}.btn-red{background:#dc2626}
.input{width:100%;background:#111;border:1px solid #333;border-radius:10px;padding:10px;color:#fff;margin:5px 0}
.log{background:#111;border:1px solid #222;border-radius:10px;padding:12px;height:350px;overflow:auto;font-size:12px;color:#9ca3af}
.toggle{margin-left:auto;width:46px;height:26px;background:#333;border-radius:20px;position:relative;cursor:pointer}
.toggle.on{background:#1877F2}.toggle:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.toggle.on:after{left:23px}
.badge{background:#222;border-radius:20px;padding:4px 10px;font-size:12px;color:#aaa}.badge.red{background:#3f1a1a;color:#f87171}.badge.green{background:#132e1f;color:#4ade80}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.stat{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:24px;display:block}
.indicator{display:flex;align-items:center;gap:8px;font-size:13px;background:#1a1a1a;border:1px solid #2a2a2a;padding:8px 12px;border-radius:20px}
</style></head><body>
<h1>Portafolio - Fix Error Conexión</h1>
<div id="perfilTop" style="margin:10px 0"></div>
<div id="loginBox" style="background:#111;border:1px dashed #333;padding:16px;border-radius:12px">
<input id="token" class="input" placeholder="Pega tu token EAA..."><button class="btn" onclick="cargarTodo()">Cargar 8 páginas →</button><p id="status" style="color:#fbbf24"></p></div>
<div id="app" style="display:none">
<div class="status-bar">
<div class="indicator"><span id="dotConn" class="dot gray"></span><span id="txtConn">Desconectado</span></div>
<div class="indicator"><span id="dotWork" class="dot gray"></span><span id="txtWork">Pausado</span></div>
<div class="indicator">⏱️ <span id="txtTimer">--</span></div>
<div class="indicator">📡 <span id="txtLast">Sin actividad</span></div>
<div class="progress"><div id="progScan" class="progress-bar"></div></div>
</div>
<div class="grid"><div class="stat"><b id="statPag">0</b>Páginas activas</div><div class="stat"><b id="statPend">0</b>Pendientes</div><div class="stat"><b id="statResp">0</b>Respondidos hoy</div><div class="stat"><b id="statScan">0</b>Posts escaneados</div></div>
<div id="lista"></div>
<div style="background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin:14px 0">
<h3>🧠 Respuestas</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="kw1" class="input" value="precio,cuanto cuesta,valor"><input id="msg1" class="input" value="Gracias {name} por tu comentario, te enviamos info por mensaje"><input id="kw2" class="input" value="donde,pais,de donde,ubicacion"><input id="msg2" class="input" value="Hola {name}, saludos desde Guatemala, desde que país nos escribes?"><input id="kw3" class="input" value="?,como,que es,para que"><input id="msg3" class="input" value="Hola {name}, que bueno que preguntas, te respondemos en un momento"></div>
<div id="msgs"></div>
<label><input type="checkbox" id="likeCheck" checked> Dar Like antes</label>
</div>
<div style="background:#052e16;border:1px solid #166534;border-radius:12px;padding:14px">
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-orange" onclick="scanAllPages()">🔍 Scan Total</button><button class="btn btn-gray" onclick="limpiarHist()">🗑️ Limpiar historial</button><select id="limitPosts" class="input" style="width:130px"><option value="100">100 posts/pág</option><option value="200" selected>200 posts/pág</option><option value="9999">TODO</option></select></div>
<div style="margin-top:12px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button id="btnAuto" class="btn btn-green" style="flex:1;font-size:16px" onclick="toggleAuto()">▶️ Activar</button><input id="minD" value="75" style="width:60px" class="input"><span>a</span><input id="maxD" value="150" style="width:60px" class="input"><span>seg</span></div><div class="progress" style="height:14px"><div id="progResp" class="progress-bar" style="background:linear-gradient(90deg,#22c55e,#16a34a)"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:4px"><span id="txtProgResp">0 / 0</span><span id="txtNext">Próximo en --</span></div></div>
</div>
<h3>📋 Pendientes</h3><div id="pendLista" style="max-height:300px;overflow:auto"></div>
<h3>📡 Log vivo</h3><div class="log" id="log"></div>
</div>
<script>
let token='',paginas=[],conectadas={},pageTokens={},pendientes=[],respondidos=new Set(JSON.parse(localStorage.getItem('respondidos')||'[]')),totalRespHoy=parseInt(localStorage.getItem('respHoy')||'0'),MENSAJES=["Gracias por tu comentario","que te parecio el video?","desde que pais nos escribes?","saludos, tu comentario es valioso para nosotros","gracias por tu comentario, saludos {name}"],auto=false,timer=null,countdownTimer=null,ultimoMsg='',conteoPorPagina={},scanTotal=0,scanDone=0;
function setConn(ok){let d=document.getElementById('dotConn');let t=document.getElementById('txtConn');if(d)d.className='dot '+(ok?'green':'red');if(t)t.innerText=ok?'Conectado - Token OK':'Desconectado';}
function setWork(w,txt){let d=document.getElementById('dotWork');let t=document.getElementById('txtWork');if(d)d.className='dot '+(w?'yellow':'gray');if(t)t.innerText=txt|| (w?'Trabajando...':'Pausado');}
function log(h){let el=document.getElementById('log');if(el)el.innerHTML=`<div style="margin:4px 0;border-left:3px solid #1877F2;padding-left:8px">${new Date().toLocaleTimeString()} - ${h}</div>`+el.innerHTML;let last=document.getElementById('txtLast');if(last)last.innerText=new Date().toLocaleTimeString()+' - '+h.substring(0,40);}
function limpiarHist(){if(confirm('Borrar historial?')){localStorage.removeItem('respondidos');respondidos=new Set();conteoPorPagina={};log('Historial limpiado');}}
function renderMsgs(){let el=document.getElementById('msgs');if(el)el.innerHTML=MENSAJES.map((m,i)=>`<input class="input" value="${m}" onchange="MENSAJES[${i}]=this.value">`).join('');}
function getSmartMsg(c,n){let lc=(c||'').toLowerCase();let rules=[{kw:document.getElementById('kw1').value.split(','),msg:document.getElementById('msg1').value},{kw:document.getElementById('kw2').value.split(','),msg:document.getElementById('msg2').value},{kw:document.getElementById('kw3').value.split(','),msg:document.getElementById('msg3').value},];for(let r of rules){if(r.kw.some(k=>k.trim()&&lc.includes(k.trim().toLowerCase()))){return r.msg.replace('{name}',n||'');}}let disp=MENSAJES.filter(m=>m!==ultimoMsg);let msg=disp[Math.floor(Math.random()*disp.length)]||MENSAJES[0];ultimoMsg=msg;return msg.replace('{name}',n||'');}
async function cargarTodo(){token=document.getElementById('token').value.trim();if(!token){alert('Pega token');return;}localStorage.setItem('fb_token',token);let s=document.getElementById('status');if(s)s.innerText='Conectando...';setConn(false);let allMap={};try{let meR=await fetch(`https://graph.facebook.com/v21.0/me?fields=name,picture.type(large)&access_token=${token}`);let me=await meR.json();if(me.error)throw new Error(me.error.message);let top=document.getElementById('perfilTop');if(top)top.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><img src="${me.picture?.data?.url||''}" style="width:56px;height:56px;border-radius:50%"><div><b>${me.name||'Usuario'}</b><br><small style="color:#4ade80">● Conectado</small></div></div>`;let r1=await fetch(`https://graph.facebook.com/v21.0/me/accounts?fields=name,id,picture.type(large),fan_count,access_token&limit=100&access_token=${token}`);let j1=await r1.json();if(j1.data)j1.data.forEach(p=>{allMap[p.id]=p;});let rb=await fetch(`https://graph.facebook.com/v21.0/me/businesses?fields=id&limit=20&access_token=${token}`);let jb=await rb.json();if(jb.data){for(let b of jb.data){try{let ro=await fetch(`https://graph.facebook.com/v21.0/${b.id}/owned_pages?fields=name,id,picture.type(large),fan_count&limit=100&access_token=${token}`);let jo=await ro.json();if(jo.data)jo.data.forEach(p=>{if(!allMap[p.id])allMap[p.id]=p;});let rc=await fetch(`https://graph.facebook.com/v21.0/${b.id}/client_pages?fields=name,id,picture.type(large),fan_count&limit=100&access_token=${token}`);let jc=await rc.json();if(jc.data)jc.data.forEach(p=>{if(!allMap[p.id])allMap[p.id]=p;});}catch(e){}}}for(let p of Object.values(allMap)){if(!p.access_token){try{let rt=await fetch(`https://graph.facebook.com/v21.0/${p.id}?fields=access_token&access_token=${token}`);let jt=await rt.json();if(jt.access_token)p.access_token=jt.access_token;}catch(e){}}if(p.access_token)pageTokens[p.id]=p;}paginas=Object.values(allMap);let lb=document.getElementById('loginBox');let app=document.getElementById('app');if(lb)lb.style.display='none';if(app)app.style.display='block';let sp=document.getElementById('statPag');if(sp)sp.innerText=paginas.length;let sr=document.getElementById('statResp');if(sr)sr.innerText=totalRespHoy;render();setConn(true);setWork(false,'Listo - Pausado');log(`✅ Conectado: ${paginas.length} páginas`);}catch(e){if(s)s.innerText='Error conexión: '+e.message;setConn(false);log('Error: '+e.message);}}
function render(){let el=document.getElementById('lista');if(!el)return;el.innerHTML=paginas.map(p=>`<div class="card ${conectadas[p.id]?'on':''}"><img src="${p.picture?.data?.url||''}" class="avatar"><div><b>${p.name}</b><br><small>${p.id}</small></div><span class="badge" id="badge-${p.id}">${conteoPorPagina[p.id]||0} pendientes</span><div class="toggle ${conectadas[p.id]?'on':''}" onclick="conectadas['${p.id}']=!conectadas['${p.id}'];render()"></div></div>`).join('');renderMsgs();}
async function fetchAllPostsDeep(pageId,pToken,limit){let all=[];let url=`https://graph.facebook.com/v21.0/${pageId}/feed?fields=id&limit=50&access_token=${pToken}`;let count=0;while(url&&(limit>=9999||count<limit)){let r=await fetch(url);let j=await r.json();if(j.error)break;if(j.data){all=all.concat(j.data);count+=j.data.length;scanDone++;let ps=document.getElementById('progScan');if(ps&&scanTotal>0)ps.style.width=(scanDone/scanTotal*100)+'%';}url=j.paging?.next;}return limit>=9999?all:all.slice(0,limit);}
async function scanAllPages(){let activas=Object.keys(conectadas).filter(id=>conectadas[id]);if(activas.length===0){alert('Activa al menos 1');return;}let limit=parseInt(document.getElementById('limitPosts').value);pendientes=[];conteoPorPagina={};let totalPosts=0;scanTotal=activas.length*(limit>=9999?300:limit);scanDone=0;setWork(true,'Escaneando...');let ps=document.getElementById('progScan');if(ps)ps.style.width='0%';let pl=document.getElementById('pendLista');if(pl)pl.innerHTML='Escaneando...';for(let pageId of activas){try{let p=pageTokens[pageId];if(!p)continue;log(`🔍 ${p.name}`);let posts=await fetchAllPostsDeep(pageId,p.access_token,limit);totalPosts+=posts.length;let countPage=0;let seenIds=new Set();for(let post of posts){try{let urlC=`https://graph.facebook.com/v21.0/${post.id}/comments?fields=id,from{name,id},message,created_time,comments{from},is_hidden&filter=stream&limit=100&access_token=${p.access_token}`;while(urlC){let rc=await fetch(urlC);let jc=await rc.json();if(!jc.data)break;for(let c of jc.data){if(seenIds.has(c.id))continue;seenIds.add(c.id);if(respondidos.has(c.id))continue;if(c.from&&c.from.id===pageId)continue;if(c.is_hidden)continue;if(c.comments&&c.comments.data&&c.comments.data.some(r=>r.from.id===pageId)){respondidos.add(c.id);continue;}pendientes.push({pageId,pageName:p.name,postId:post.id,commentId:c.id,message:c.message,fromName:c.from?.name||'amigo',time:c.created_time,pToken:p.access_token});countPage++;}urlC=jc.paging?.next;}}catch(e){}}conteoPorPagina[pageId]=countPage;let badge=document.getElementById(`badge-${pageId}`);if(badge){badge.innerText=countPage+' pendientes';badge.className='badge '+(countPage>0?'red':'green');}}catch(e){log(`Error ${pageId}`);}}let sumaReal=Object.values(conteoPorPagina).reduce((a,b)=>a+b,0);let sp=document.getElementById('statPend');if(sp)sp.innerText=sumaReal;let ss=document.getElementById('statScan');if(ss)ss.innerText=totalPosts;let pendEl=document.getElementById('pendLista');if(pendEl)pendEl.innerHTML=pendientes.slice(0,200).map(p=>`<div class="card" style="border-left:4px solid #f59e0b"><div><b>${p.pageName}</b> - <b>${p.fromName}</b>: "${(p.message||'').substring(0,110)}"</div></div>`).join('')+(pendientes.length>200?`<p>+ ${pendientes.length-200} más</p>`:'');if(ps)ps.style.width='100%';setWork(false,'Escaneo completo');log(`✅ Scan: ${sumaReal} pendientes en ${totalPosts} posts`);let pr=document.getElementById('progResp');if(pr)pr.style.width='0%';let tpr=document.getElementById('txtProgResp');if(tpr)tpr.innerText=`0 / ${sumaReal}`;}
function toggleAuto(){if(pendientes.length===0){alert('Primero Scan');return;}let btn=document.getElementById('btnAuto');if(auto){auto=false;clearTimeout(timer);clearInterval(countdownTimer);if(btn){btn.innerText='▶️ Activar';btn.className='btn btn-green';}setWork(false,'Pausado');log('Pausado');return;}auto=true;if(btn){btn.innerText='⏸️ Pausar - Trabajando';btn.className='btn btn-red';}setWork(true,'Respondiendo...');responderNext();}
async function responderNext(){if(!auto||pendientes.length===0){auto=false;let btn=document.getElementById('btnAuto');if(btn){btn.innerText='▶️ Activar';btn.className='btn btn-green';}setWork(false,'Terminado');if(pendientes.length===0)log('✅ Todos respondidos');return;}let it=pendientes.shift();let totalInicial=Object.values(conteoPorPagina).reduce((a,b)=>a+b,0)+pendientes.length+1;let remaining=pendientes.length;let pr=document.getElementById('progResp');if(pr&&totalInicial>0)pr.style.width=((totalInicial-remaining)/totalInicial*100)+'%';let tpr=document.getElementById('txtProgResp');if(tpr)tpr.innerText=`${totalInicial-remaining} / ${totalInicial}`;if(conteoPorPagina[it.pageId])conteoPorPagina[it.pageId]--;let sumaReal=Object.values(conteoPorPagina).reduce((a,b)=>a+b,0)+remaining;let sp=document.getElementById('statPend');if(sp)sp.innerText=Math.max(0,sumaReal);try{let msg=getSmartMsg(it.message,it.fromName);let likeCheck=document.getElementById('likeCheck');if(likeCheck&&likeCheck.checked){try{await fetch(`https://graph.facebook.com/v21.0/${it.commentId}/likes?method=POST&access_token=${it.pToken}`,{method:'POST'});}catch(e){}}log(`💬 ${it.pageName} → ${it.fromName}: "${(it.message||'').substring(0,30)}" → "${msg}"`);let rp=await fetch(`https://graph.facebook.com/v21.0/${it.commentId}/comments?method=POST&message=${encodeURIComponent(msg)}&access_token=${it.pToken}`,{method:'POST'});let jr=await rp.json();if(jr.id){respondidos.add(it.commentId);localStorage.setItem('respondidos',JSON.stringify([...respondidos]));totalRespHoy++;localStorage.setItem('respHoy',totalRespHoy);let sr=document.getElementById('statResp');if(sr)sr.innerText=totalRespHoy;}else{log('❌ '+jr.error?.message);if(jr.error?.code!==368)pendientes.push(it);}}catch(e){log(e.message);}let min=parseInt(document.getElementById('minD').value)||75;let max=parseInt(document.getElementById('maxD').value)||150;let delay=(Math.floor(Math.random()*(max-min+1))+min)*1000;let sec=Math.round(delay/1000);let left=sec;let tn=document.getElementById('txtNext');let tt=document.getElementById('txtTimer');if(tn)tn.innerText=`Próximo en ${left}s`;if(tt)tt.innerText=`Próximo en ${left}s - Quedan ${pendientes.length}`;clearInterval(countdownTimer);countdownTimer=setInterval(()=>{left--;if(left>=0){if(tn)tn.innerText=`Próximo en ${left}s`;if(tt)tt.innerText=`Próximo en ${left}s - Quedan ${pendientes.length}`;}else clearInterval(countdownTimer);},1000);timer=setTimeout(responderNext,delay);}
let saved=localStorage.getItem('fb_token');if(saved){let el=document.getElementById('token');if(el)el.value=saved;}renderMsgs();
</script></body></html>
