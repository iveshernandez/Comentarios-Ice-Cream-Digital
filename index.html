<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Rapido</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px;max-width:1200px;margin:auto}.status-bar{background:#151515;border:1px solid #262626;border-radius:14px;padding:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0;position:sticky;top:10px;z-index:10}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.dot.green{background:#22c55e}.dot.red{background:#ef4444}.dot.yellow{background:#eab308}.dot.gray{background:#555}.progress{height:10px;background:#222;border-radius:10px;overflow:hidden;flex:1;min-width:150px}.progress-bar{height:100%;background:#1877F2;width:0%;transition:.3s}.card{background:#171717;border:1px solid #262626;border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:#222;object-fit:cover}.btn{background:#1877F2;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer}.btn-green{background:#16a34a}.btn-orange{background:#ea580c}.btn-gray{background:#333}.btn-red{background:#dc2626}.input{width:100%;background:#111;border:1px solid #333;border-radius:10px;padding:10px;color:#fff;margin:5px 0}.log{background:#111;border:1px solid #222;border-radius:10px;padding:12px;height:350px;overflow:auto;font-size:12px;color:#9ca3af}.toggle{margin-left:auto;width:46px;height:26px;background:#333;border-radius:20px;position:relative;cursor:pointer}.toggle.on{background:#1877F2}.toggle:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.toggle.on:after{left:23px}.badge{background:#222;border-radius:20px;padding:4px 10px;font-size:12px;color:#aaa}.badge.red{background:#3f1a1a;color:#f87171}.badge.green{background:#132e1f;color:#4ade80}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}.stat{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:24px;display:block}.indicator{display:flex;align-items:center;gap:8px;font-size:13px;background:#1a1a1a;border:1px solid #2a2a2a;padding:8px 12px;border-radius:20px}</style></head><body>
<h1>⚡ Scan Rapido x5 Paralelo</h1><div id="perfilTop"></div><div id="loginBox" style="background:#111;border:1px dashed #333;padding:16px;border-radius:12px"><input id="token" class="input" placeholder="Token EAA..."><button class="btn" onclick="cargarTodo()">Cargar</button><p id="status"></p></div><div id="app" style="display:none"><div class="status-bar"><div class="indicator"><span id="dotConn" class="dot gray"></span><span id="txtConn">Desconectado</span></div><div class="indicator"><span id="dotWork" class="dot gray"></span><span id="txtWork">Pausado</span></div><div class="indicator">⚡ <span id="txtSpeed">0/s</span></div><div class="indicator">⏱️ <span id="txtTimer">--</span></div><div class="progress"><div id="progScan" class="progress-bar"></div></div></div><div class="grid"><div class="stat"><b id="statPag">0</b>Paginas</div><div class="stat"><b id="statPend">0</b>Pendientes</div><div class="stat"><b id="statResp">0</b>Resp</div><div class="stat"><b id="statScan">0</b>Posts</div></div><div id="lista"></div><div style="background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin:14px 0"><label>Solo ultimos: <select id="dias" class="input" style="width:120px"><option value="0">Todos</option><option value="3">3 dias</option><option value="7" selected>7 dias (mas rapido)</option></select></label> <label>Paralelo: <select id="conc" class="input" style="width:100px"><option value="3">x3</option><option value="5" selected>x5</option><option value="10">x10</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="kw1" class="input" value="precio"><input id="msg1" class="input" value="Gracias {name}"><input id="kw2" class="input" value="donde"><input id="msg2" class="input" value="Hola {name} saludos"><input id="kw3" class="input" value="?"><input id="msg3" class="input" value="Hola {name}"></div></div><div style="background:#052e16;border:1px solid #166534;border-radius:12px;padding:14px"><div style="display:flex;gap:8px"><button class="btn btn-orange" onclick="scanAllPages()">⚡ Scan Rapido x5</button><select id="limitPosts" class="input" style="width:100px"><option value="50">50</option><option value="100">100</option><option value="200" selected>200</option></select></div><div style="margin-top:12px"><button id="btnAuto" class="btn btn-green" style="width:100%" onclick="toggleAuto()">▶️ Activar</button><div class="progress" style="height:14px"><div id="progResp" class="progress-bar" style="background:#22c55e"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#888"><span id="txtProgResp">0/0</span><span id="txtNext">--</span></div></div></div><h3>Pendientes</h3><div id="pendLista"></div><h3>Log</h3><div class="log" id="log"></div></div><script>
let token='',paginas=[],conectadas={},pageTokens={},pendientes=[],respondidos=new Set(JSON.parse(localStorage.getItem('respondidos')||'[]')),totalRespHoy=0,MENSAJES=["Gracias {name}"],auto=false,timer=null,countdownTimer=null,ultimoMsg='',conteoPorPagina={},scanTotal=0,scanDone=0,scanStart=0;
function setConn(ok){let d=document.getElementById('dotConn');let t=document.getElementById('txtConn');if(d)d.className='dot '+(ok?'green':'red');if(t)t.innerText=ok?'Conectado':'Desconectado';}
function setWork(w,txt){let d=document.getElementById('dotWork');let t=document.getElementById('txtWork');if(d)d.className='dot '+(w?'yellow':'gray');if(t)t.innerText=txt||(w?'Trabajando':'Pausado');}
function log(h){let el=document.getElementById('log');if(el)el.innerHTML=`<div>${new Date().toLocaleTimeString()} - ${h}</div>`+el.innerHTML;}
function getSmartMsg(c,n){return (document.getElementById('msg1').value||'Gracias').replace('{name}',n||'');}
async function cargarTodo(){token=document.getElementById('token').value.trim();localStorage.setItem('fb_token',token);let allMap={};try{let meR=await fetch(`https://graph.facebook.com/v21.0/me?fields=name,picture.type(large)&access_token=${token}`);let me=await meR.json();if(me.error)throw new Error(me.error.message);let top=document.getElementById('perfilTop');if(top)top.innerHTML=me.name;let r1=await fetch(`https://graph.facebook.com/v21.0/me/accounts?fields=name,id,picture.type(large),access_token&limit=100&access_token=${token}`);let j1=await r1.json();if(j1.data)j1.data.forEach(p=>{allMap[p.id]=p;});let rb=await fetch(`https://graph.facebook.com/v21.0/me/businesses?fields=id&limit=20&access_token=${token}`);let jb=await rb.json();if(jb.data){for(let b of jb.data){try{let ro=await fetch(`https://graph.facebook.com/v21.0/${b.id}/owned_pages?fields=name,id,picture.type(large)&limit=100&access_token=${token}`);let jo=await ro.json();if(jo.data)jo.data.forEach(p=>{if(!allMap[p.id])allMap[p.id]=p;});let rc=await fetch(`https://graph.facebook.com/v21.0/${b.id}/client_pages?fields=name,id,picture.type(large)&limit=100&access_token=${token}`);let jc=await rc.json();if(jc.data)jc.data.forEach(p=>{if(!allMap[p.id])allMap[p.id]=p;});}catch(e){}}}for(let p of Object.values(allMap)){if(!p.access_token){try{let rt=await fetch(`https://graph.facebook.com/v21.0/${p.id}?fields=access_token&access_token=${token}`);let jt=await rt.json();if(jt.access_token)p.access_token=jt.access_token;}catch(e){}}if(p.access_token)pageTokens[p.id]=p;}paginas=Object.values(allMap);document.getElementById('loginBox').style.display='none';document.getElementById('app').style.display='block';document.getElementById('statPag').innerText=paginas.length;render();setConn(true);setWork(false,'Listo');log(paginas.length+' paginas');}catch(e){document.getElementById('status').innerText='Error: '+e.message;setConn(false);}}
function render(){let el=document.getElementById('lista');if(!el)return;el.innerHTML=paginas.map(p=>`<div class="card ${conectadas[p.id]?'on':''}"><img src="${p.picture?.data?.url||''}" class="avatar"><div><b>${p.name}</b></div><span class="badge" id="badge-${p.id}">${conteoPorPagina[p.id]||0}</span><div class="toggle ${conectadas[p.id]?'on':''}" onclick="conectadas['${p.id}']=!conectadas['${p.id}'];render()"></div></div>`).join('');}
async function fetchAllPostsDeep(pageId,pToken,limit){let all=[];let url=`https://graph.facebook.com/v21.0/${pageId}/feed?fields=id,created_time&limit=50&access_token=${pToken}`;let count=0;let dias=parseInt(document.getElementById('dias').value)||0;let cutoff=dias>0?Date.now()-dias*24*3600*1000:0;while(url&&(count<limit)){let r=await fetch(url);let j=await r.json();if(j.error)break;if(j.data){let filtered=j.data;if(cutoff>0){filtered=j.data.filter(p=> new Date(p.created_time).getTime()>cutoff); if(filtered.length<j.data.length){ all=all.concat(filtered); break; }} all=all.concat(filtered); count+=filtered.length;}url=j.paging?.next;}return all.slice(0,limit);}
async function scanOnePost(post,p,seenGlobal){try{let comments=[];let urlC=`https://graph.facebook.com/v21.0/${post.id}/comments?fields=id,from{name,id},message,created_time,comments{from},is_hidden&filter=stream&limit=100&access_token=${p.access_token}`;while(urlC){let rc=await fetch(urlC);let jc=await rc.json();if(!jc.data)break;for(let c of jc.data){if(seenGlobal.has(c.id))continue;seenGlobal.add(c.id);if(respondidos.has(c.id))continue;if(c.from&&c.from.id===p.id)continue;if(c.is_hidden)continue;if(c.comments&&c.comments.data&&c.comments.data.some(r=>r.from.id===p.id)){respondidos.add(c.id);continue;}comments.push({pageId:p.id,pageName:p.name,postId:post.id,commentId:c.id,message:c.message,fromName:c.from?.name||'amigo',time:c.created_time,pToken:p.access_token});}urlC=jc.paging?.next;}return comments;}catch(e){return [];} }
async function scanAllPages(){let activas=Object.keys(conectadas).filter(id=>conectadas[id]);if(activas.length===0){alert('Activa 1');return;}let limit=parseInt(document.getElementById('limitPosts').value);let conc=parseInt(document.getElementById('conc').value)||5;pendientes=[];conteoPorPagina={};let totalPosts=0;scanTotal=activas.length*limit;scanDone=0;scanStart=Date.now();setWork(true,`x${conc} rapido`);document.getElementById('progScan').style.width='0%';for(let pageId of activas){try{let p=pageTokens[pageId];if(!p)continue;log(`${p.name} - ${limit} posts x${conc}`);let posts=await fetchAllPostsDeep(pageId,p.access_token,limit);totalPosts+=posts.length;let countPage=0;let seenIds=new Set();let idx=0;while(idx<posts.length){let batch=posts.slice(idx,idx+conc);let results=await Promise.all(batch.map(post=>scanOnePost(post,p,seenIds)));for(let arr of results){for(let c of arr){pendientes.push(c);countPage++;} scanDone++; let ps=document.getElementById('progScan'); if(ps&&scanTotal>0) ps.style.width=(scanDone/scanTotal*100)+'%'; let elapsed=(Date.now()-scanStart)/1000; let speed=elapsed>0?(scanDone/elapsed).toFixed(1):0; let ts=document.getElementById('txtSpeed'); if(ts) ts.innerText=speed+' posts/seg'; } idx+=conc; }conteoPorPagina[pageId]=countPage;let badge=document.getElementById(`badge-${pageId}`);if(badge){badge.innerText=countPage;badge.className='badge '+(countPage>0?'red':'green');}}catch(e){log(`Error ${pageId}`);}}let sumaReal=Object.values(conteoPorPagina).reduce((a,b)=>a+b,0);document.getElementById('statPend').innerText=sumaReal;document.getElementById('pendLista').innerHTML=pendientes.slice(0,100).map(p=>`<div class="card"><div><b>${p.pageName}</b> - ${p.fromName}: ${(p.message||'').substring(0,80)}</div></div>`).join('');document.getElementById('progScan').style.width='100%';setWork(false,`Listo ${sumaReal} en ${((Date.now()-scanStart)/1000).toFixed(1)}s`);log(`⚡ ${sumaReal} en ${totalPosts} posts - ${((Date.now()-scanStart)/1000).toFixed(1)}s`);}
function toggleAuto(){if(pendientes.length===0){alert('Scan primero');return;}let btn=document.getElementById('btnAuto');if(auto){auto=false;clearTimeout(timer);clearInterval(countdownTimer);if(btn){btn.innerText='Activar';btn.className='btn btn-green';}setWork(false,'Pausado');return;}auto=true;if(btn){btn.innerText='Pausar';btn.className='btn btn-red';}setWork(true,'Respondiendo');responderNext();}
async function responderNext(){if(!auto||pendientes.length===0){auto=false;setWork(false,'Terminado');return;}let it=pendientes.shift();let sp=document.getElementById('statPend');if(sp)sp.innerText=Math.max(0,parseInt(sp.innerText)-1);try{let msg=getSmartMsg(it.message,it.fromName);log(`${it.pageName} -> ${it.fromName}`);let rp=await fetch(`https://graph.facebook.com/v21.0/${it.commentId}/comments?method=POST&message=${encodeURIComponent(msg)}&access_token=${it.pToken}`,{method:'POST'});let jr=await rp.json();if(jr.id){respondidos.add(it.commentId);localStorage.setItem('respondidos',JSON.stringify([...respondidos]));}}catch(e){log(e.message);}let delay=(Math.random()*75+75)*1000;timer=setTimeout(responderNext,delay);}
let saved=localStorage.getItem('fb_token');if(saved){let el=document.getElementById('token');if(el)el.value=saved;}
</script></body></html>
