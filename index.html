
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Scan - Todos los comentarios</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;padding:20px;max-width:1100px;margin:auto}
.card{background:#171717;border:1px solid #262626;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;margin:10px 0}
.card.on{border-color:#1877F2;background:#121e35}
.avatar{width:52px;height:52px;border-radius:50%;background:#222;object-fit:cover}
.btn{background:#1877F2;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-green{background:#16a34a} .btn-red{background:#dc2626} .btn-orange{background:#ea580c}
.input{width:100%;background:#111;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:6px 0}
.log{background:#111;border:1px solid #222;border-radius:10px;padding:12px;height:450px;overflow:auto;font-size:13px;color:#9ca3af}
.toggle{margin-left:auto;width:48px;height:28px;background:#333;border-radius:20px;position:relative;cursor:pointer}
.toggle.on{background:#1877F2}
.toggle:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on:after{left:23px}
.pending{background:#1a1a0a;border:1px solid #444;border-left:4px solid #f59e0b;border-radius:8px;padding:10px;margin:6px 0}
</style></head><body>
<h1>Deep Scan - Revisa TODOS los comentarios (no solo 10 posts)</h1>
<p style="color:#888">Va a la bandeja completa de cada página + limpia historial</p>

<div id="loginBox" style="background:#111;border:1px dashed #333;padding:18px;border-radius:12px;margin:18px 0">
<input id="token" class="input" placeholder="Pega tu token EAA... Usuario del Sistema">
<button class="btn" onclick="cargar()">Cargar mis 8 páginas →</button>
<p id="status" style="color:#fbbf24"></p>
</div>

<div id="app" style="display:none">
<div id="perfil"></div>
<div id="lista"></div>

<div style="background:#111;border:1px solid #333;padding:14px;border-radius:12px;margin:16px 0">
<h3>📋 Deep Scan - Todos los comentarios</h3>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<label style="color:#888">Escanear hasta: </label>
<select id="numPosts" class="input" style="width:150px"><option value="20">20 posts/página</option><option value="50" selected>50 posts/página</option><option value="100">100 posts/página (lento pero completo)</option></select>
<button class="btn" style="background:#333" onclick="limpiarHistorial()">🗑️ Limpiar historial de respondidos (si te marca 0 y sí tienes)</button>
</div>
<button class="btn btn-orange" onclick="escanearDeep()" id="btnScan" style="width:100%;margin-top:12px;font-size:16px">🔍 Deep Scan - Buscar en TODA la bandeja de comentarios</button>
<div id="scanStatus" style="margin-top:10px"></div>
<div style="background:#222;border-radius:10px;height:14px;overflow:hidden;margin:10px 0"><div id="prog" style="width:0%;background:#f59e0b;height:100%"></div></div>
<div id="pendientesLista" style="max-height:300px;overflow:auto"></div>
</div>

<div style="background:#052e16;border:1px solid #166534;padding:14px;border-radius:12px">
<h3>🤖 Responder todo pendiente</h3>
<div style="display:flex;gap:12px;align-items:center">
<span id="totalPend" style="font-size:24px;font-weight:800">0</span> pendientes
<input id="minD" value="90" style="width:60px" class="input"><span>a</span><input id="maxD" value="180" style="width:60px" class="input"><span>seg</span>
</div>
<button id="btnResponder" class="btn btn-green" style="width:100%;font-size:17px;margin-top:8px" onclick="toggleResponder()">▶️ Responder TODO lo pendiente lento</button>
</div>

<h3>Mensajes</h3>
<div id="msgs"></div>

<h3>📡 Log en vivo</h3>
<div class="log" id="log"></div>
</div>

<script>
let token='', paginas=[], conectadas={}, pageTokens={}, MENSAJES=["Gracias por tu comentario","que te parecio el video?","desde que pais nos escribes?","saludos, tu comentario es valioso para nosotros","gracias por tu comentario, saludos"], respondidos=new Set(JSON.parse(localStorage.getItem('respondidos')||'[]')), pendientes=[], auto=false, timer=null, ultimoMsg='';

function log(h){ let d=document.getElementById('log'); d.innerHTML=`<div style="margin:6px 0;border-left:3px solid #1877F2;padding-left:8px">${new Date().toLocaleTimeString()} - ${h}</div>`+d.innerHTML; }
function limpiarHistorial(){ if(confirm('¿Borrar historial? Esto hará que vuelva a detectar comentarios que ya marcaste como respondidos.')){ localStorage.removeItem('respondidos'); respondidos=new Set(); log('🗑️ Historial limpiado - ahora sí detectará todos los pendientes reales'); } }

async function cargar(){
 token=document.getElementById('token').value.trim();
 if(!token.startsWith('EAA')) return alert('Token inválido');
 localStorage.setItem('fb_token',token);
 document.getElementById('status').innerText='Cargando páginas...';
 let allMap={};
 try{
   let meR=await fetch(`https://graph.facebook.com/v21.0/me?fields=name,picture.type(large)&access_token=${token}`);
   let me=await meR.json();
   document.getElementById('perfil').innerHTML=`<div style="display:flex;gap:12px;align-items:center"><img src="${me.picture.data.url}" class="avatar" style="width:60px;height:60px"><div><b>${me.name}</b></div></div>`;
   let r1=await fetch(`https://graph.facebook.com/v21.0/me/accounts?fields=name,id,picture.type(large),fan_count,access_token&limit=100&access_token=${token}`);
   let j1=await r1.json(); if(j1.data) j1.data.forEach(p=>{ allMap[p.id]=p; pageTokens[p.id]=p.access_token; });
   let rb=await fetch(`https://graph.facebook.com/v21.0/me/businesses?fields=id&limit=20&access_token=${token}`);
   let jb=await rb.json();
   if(jb.data){ for(let b of jb.data){ try{ let ro=await fetch(`https://graph.facebook.com/v21.0/${b.id}/owned_pages?fields=name,id,picture.type(large),fan_count&limit=100&access_token=${token}`); let jo=await ro.json(); if(jo.data) jo.data.forEach(p=>{ if(!allMap[p.id]) allMap[p.id]=p; }); let rc=await fetch(`https://graph.facebook.com/v21.0/${b.id}/client_pages?fields=name,id,picture.type(large),fan_count&limit=100&access_token=${token}`); let jc=await rc.json(); if(jc.data) jc.data.forEach(p=>{ if(!allMap[p.id]) allMap[p.id]=p; }); }catch(e){} } }
   for(let p of Object.values(allMap)){ if(!pageTokens[p.id]){ try{ let rt=await fetch(`https://graph.facebook.com/v21.0/${p.id}?fields=access_token&access_token=${token}`); let jt=await rt.json(); if(jt.access_token) pageTokens[p.id]=jt.access_token; }catch(e){} } }
   paginas=Object.values(allMap);
   document.getElementById('loginBox').style.display='none';
   document.getElementById('app').style.display='block';
   render();
   log(`✅ ${paginas.length} páginas cargadas. Si te marca 0, dale a Limpiar historial y Deep Scan`);
 }catch(e){ document.getElementById('status').innerText='Error: '+e.message; }
}
function render(){ document.getElementById('lista').innerHTML=paginas.map(p=>`<div class="card ${conectadas[p.id]?'on':''}"><img src="${p.picture?.data?.url||''}" class="avatar"><div><b>${p.name}</b><br><small>${p.id}</small></div><div class="toggle ${conectadas[p.id]?'on':''}" onclick="conectadas['${p.id}']=!conectadas['${p.id}'];render()"></div></div>`).join(''); renderMsgs(); }
function renderMsgs(){ document.getElementById('msgs').innerHTML=MENSAJES.map((m,i)=>`<input class="input" value="${m}" onchange="MENSAJES[${i}]=this.value">`).join(''); }
function getRandomMsg(){ let d=MENSAJES.filter(m=>m!==ultimoMsg); let msg=d[Math.floor(Math.random()*d.length)]; ultimoMsg=msg; return msg; }

async function fetchAllPosts(pageId, pToken, limitPosts){
 let posts=[];
 let url=`https://graph.facebook.com/v21.0/${pageId}/feed?fields=id&limit=25&access_token=${pToken}`;
 let count=0;
 while(url && count < limitPosts){
   try{
     let r=await fetch(url);
     let j=await r.json();
     if(j.data) { posts=posts.concat(j.data); count+=j.data.length; }
     url=j.paging?.next;
     if(j.data && j.data.length>0) log(`📄 ${pageId}: ${posts.length} posts cargados...`);
   }catch(e){ break; }
 }
 return posts.slice(0,limitPosts);
}

async function escanearDeep(){
 let activas=Object.keys(conectadas).filter(id=>conectadas[id]);
 if(activas.length===0){ alert('Activa al menos 1 página'); return; }
 let numPosts=parseInt(document.getElementById('numPosts').value);
 pendientes=[];
 document.getElementById('pendientesLista').innerHTML='';
 document.getElementById('btnScan').innerText='Escaneando profundo... esto tarda';
 let total=activas.length, done=0;
 for(let pageId of activas){
   try{
     let pToken=pageTokens[pageId];
     if(!pToken) continue;
     let pageName=paginas.find(p=>p.id===pageId)?.name||pageId;
     log(`🔍 Deep Scan en ${pageName} - revisando ${numPosts} posts de la bandeja...`);
     let posts=await fetchAllPosts(pageId, pToken, numPosts);
     log(`📋 ${pageName}: ${posts.length} posts encontrados, revisando comentarios...`);
     for(let post of posts){
       try{
         let urlC=`https://graph.facebook.com/v21.0/${post.id}/comments?fields=id,from{name},message,created_time,comments{from}&filter=stream&limit=100&access_token=${pToken}`;
         while(urlC){
           let rc=await fetch(urlC);
           let jc=await rc.json();
           if(!jc.data) break;
           for(let c of jc.data){
             if(respondidos.has(c.id)) continue;
             if(c.from && c.from.id===pageId) continue;
             if(c.comments && c.comments.data && c.comments.data.some(r=>r.from.id===pageId)) { respondidos.add(c.id); continue; }
             pendientes.push({pageId, pageName, commentId:c.id, message:c.message, from:c.from?.name, created_time:c.created_time, pToken});
           }
           urlC=jc.paging?.next;
         }
       }catch(e){}
     }
   }catch(e){ log(`Error ${pageId}: ${e.message}`); }
   done++; document.getElementById('prog').style.width=(done/total*100)+'%';
 }
 document.getElementById('totalPend').innerText=pendientes.length;
 document.getElementById('scanStatus').innerHTML=`<b style="color:#4ade80">✅ Deep Scan completo: ${pendientes.length} pendientes en ${numPosts} posts por página</b><br><small style="color:#888">Si tienes más, sube a 100 posts/página</small>`;
 document.getElementById('pendientesLista').innerHTML=pendientes.slice(0,80).map(p=>`<div class="pending"><div><b>${p.pageName}</b> - ${p.from}: "${(p.message||'').substring(0,90)}"<br><small>${new Date(p.created_time).toLocaleString()}</small></div></div>`).join('') + (pendientes.length>80?`<p>+ ${pendientes.length-80} más...</p>`:'');
 document.getElementById('btnScan').innerText='🔍 Re-escanear Deep';
 log(`📋 Total pendientes REALES: ${pendientes.length}`);
 localStorage.setItem('respondidos', JSON.stringify([...respondidos]));
}

function toggleResponder(){
 if(pendientes.length===0){ alert('Primero Deep Scan'); return; }
 if(auto){ auto=false; clearTimeout(timer); document.getElementById('btnResponder').innerText='▶️ Responder TODO lo pendiente lento'; document.getElementById('btnResponder').className='btn btn-green'; log('⏸️ Pausado'); return; }
 auto=true;
 document.getElementById('btnResponder').innerText='⏸️ Pausar - Respondiendo pendientes...';
 document.getElementById('btnResponder').className='btn btn-red';
 responderSiguiente();
}
async function responderSiguiente(){
 if(!auto) return;
 if(pendientes.length===0){ log('✅ ¡Todos los pendientes respondidos!'); auto=false; return; }
 let item=pendientes.shift();
 document.getElementById('totalPend').innerText=pendientes.length;
 try{
   let msg=getRandomMsg();
   log(`💬 ${item.pageName} → ${item.from}: "${(item.message||'').substring(0,40)}" → "${msg}"`);
   let resp=await fetch(`https://graph.facebook.com/v21.0/${item.commentId}/comments?method=POST&message=${encodeURIComponent(msg)}&access_token=${item.pToken}`, {method:'POST'});
   let jr=await resp.json();
   if(jr.id){
     respondidos.add(item.commentId);
     localStorage.setItem('respondidos', JSON.stringify([...respondidos]));
     log(`✅ Respondido`);
   } else {
     log(`❌ ${jr.error?.message}`);
     if(jr.error?.code!==368) pendientes.push(item);
   }
 }catch(e){ log(`Error: ${e.message}`); }
 let min=parseInt(document.getElementById('minD').value)||90;
 let max=parseInt(document.getElementById('maxD').value)||180;
 let delay=(Math.floor(Math.random()*(max-min+1))+min)*1000;
 log(`⏳ ${Math.round(delay/1000)}s... quedan ${pendientes.length}`);
 timer=setTimeout(responderSiguiente, delay);
}

let saved=localStorage.getItem('fb_token'); if(saved) document.getElementById('token').value=saved;
renderMsgs();
</script></body></html>
